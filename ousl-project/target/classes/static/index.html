<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Store Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm py-2">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
        <i class="bi bi-book-half text-primary fs-3"></i>
        <span>Book Store <span class="badge bg-primary text-white fs-6 fw-normal">CRUD Manager</span></span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-success-subtle text-success border border-success px-3 py-2 d-flex align-items-center gap-2" id="health-badge">
          <span class="spinner-grow spinner-grow-sm text-success" role="status" style="width: 0.5rem; height: 0.5rem;"></span>
          <span id="health-text">Online</span>
        </span>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container py-4">
    <!-- Header & Action Card -->
    <div class="card border-0 shadow-sm rounded-3 mb-4">
      <div class="card-body p-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
          <div>
            <h2 class="fw-bold mb-1 text-dark">Book Store Inventory</h2>
            <p class="text-muted mb-0">Manage books in store: Create, Read, Update, and Delete</p>
          </div>
          <button class="btn btn-primary btn-lg d-flex align-items-center gap-2 shadow-sm" onclick="app.openAddModal()">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Add New Book</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Books Table Card -->
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 60px;" class="ps-4">#</th>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>ISBN</th>
                <th>Price ($)</th>
                <th>Stock</th>
                <th class="text-end pe-4" style="width: 140px;">Actions</th>
              </tr>
            </thead>
            <tbody id="books-table-body">
              <tr>
                <td colspan="8" class="text-center py-5 text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                  Loading books...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Add / Edit Book Modal -->
  <div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="bookModalTitle">Add New Book</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="book-form" onsubmit="event.preventDefault(); app.saveBook();">
          <div class="modal-body p-4">
            <input type="hidden" id="book-id">
            
            <div class="mb-3">
              <label class="form-label small fw-semibold">Book Title <span class="text-danger">*</span></label>
              <input type="text" id="book-title" class="form-control" required placeholder="e.g. Clean Code">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Author <span class="text-danger">*</span></label>
              <input type="text" id="book-author" class="form-control" required placeholder="e.g. Robert C. Martin">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-12 col-sm-6">
                <label class="form-label small fw-semibold">Category <span class="text-danger">*</span></label>
                <input type="text" id="book-category" class="form-control" required placeholder="e.g. Programming">
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label small fw-semibold">ISBN <span class="text-danger">*</span></label>
                <input type="text" id="book-isbn" class="form-control" required placeholder="e.g. 978-0132350884">
              </div>
            </div>

            <div class="row g-2">
              <div class="col-12 col-sm-6">
                <label class="form-label small fw-semibold">Price ($ USD) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input type="number" id="book-price" class="form-control" step="0.01" min="0.01" required placeholder="29.99">
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label small fw-semibold">Stock Quantity <span class="text-danger">*</span></label>
                <input type="number" id="book-stock" class="form-control" min="0" required placeholder="10">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-save-book">
              <i class="bi bi-check-lg me-1"></i> Save Book
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;"></div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application JS -->
  <script src="/js/app.js"></script>
</body>
</html>
