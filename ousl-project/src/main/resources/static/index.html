<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm py-2">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
        <i class="bi bi-mortarboard-fill text-primary fs-3"></i>
        <span>Student Management</span>
      </a>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container py-4">
    <!-- Header & Action Card -->
    <div class="card border-0 shadow-sm rounded-3 mb-4">
      <div class="card-body p-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
          <div>
            <h2 class="fw-bold mb-1 text-dark">Student Records</h2>
            <p class="text-muted mb-0">Manage students: Create, Read, Update, and Delete</p>
          </div>
          <button class="btn btn-primary btn-lg d-flex align-items-center gap-2 shadow-sm" onclick="app.openAddModal()">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Add New Student</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Students Table Card -->
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 60px;" class="ps-4">#</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Birthday</th>
                <th>Course</th>
                <th>City</th>
                <th>Phone Number</th>
                <th class="text-end pe-4" style="width: 140px;">Actions</th>
              </tr>
            </thead>
            <tbody id="students-table-body">
              <tr>
                <td colspan="8" class="text-center py-5 text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                  Loading students...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Add / Edit Student Modal -->
  <div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="studentModalTitle">Add New Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="student-form" onsubmit="event.preventDefault(); app.saveStudent();">
          <div class="modal-body p-4">
            <input type="hidden" id="student-id">

            <div class="row g-2 mb-3">
              <div class="col-12 col-sm-6">
                <label class="form-label small fw-semibold">First Name <span class="text-danger">*</span></label>
                <input type="text" id="student-firstName" class="form-control" required placeholder="e.g. Kasun">
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label small fw-semibold">Last Name <span class="text-danger">*</span></label>
                <input type="text" id="student-lastName" class="form-control" required placeholder="e.g. Perera">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Birthday <span class="text-danger">*</span></label>
              <input type="date" id="student-birthday" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Course <span class="text-danger">*</span></label>
              <input type="text" id="student-course" class="form-control" required placeholder="e.g. BSc Computer Science">
            </div>

            <div class="row g-2">
              <div class="col-12 col-sm-6">
                <label class="form-label small fw-semibold">City <span class="text-danger">*</span></label>
                <input type="text" id="student-city" class="form-control" required placeholder="e.g. Colombo">
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label small fw-semibold">Phone Number <span class="text-danger">*</span></label>
                <input type="text" id="student-phoneNumber" class="form-control" required placeholder="e.g. 0771234567">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-save-student">
              <i class="bi bi-check-lg me-1"></i> Save Student
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;"></div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application JS -->
  <script src="/js/app.js"></script>
</body>
</html>
